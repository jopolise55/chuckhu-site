<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Enhe Hu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!--
    NOTE: the original Cargo "Email" link opened a hosted contact form that
    posted through Cargo's own backend — that backend won't exist once you
    leave Cargo. GitHub Pages can't run server-side form handlers, so this
    is replaced with a plain mailto: link. Swap YOUR-EMAIL@example.com below
    for the address you want visitors to reach. If you want an actual
    in-page form instead of mailto, free options are Formspree or
    Getform (both have a free tier and work on static sites).
  -->
  <header class="site-header">
    <a href="index.html" class="logo">Enhe™</a>
  </header>

  <main class="contact-page">
    <p>Get in touch</p>
    <a class="email" href="mailto:YOUR-EMAIL@example.com">YOUR-EMAIL@example.com</a>
  </main>

  <footer class="site-footer">©2026 Enhe Hu.</footer>
</body>
</html>
